name: Manual SepticScope research and quality audit

on:
  workflow_dispatch:
    inputs:
      county_limit:
        description: "Counties to inspect for provider evidence without publishing automatically"
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: manual-septicscope-research
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COUNTY_LIMIT: ${{ github.event.inputs.county_limit || '100' }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source and self-test audit tooling
        run: |
          python -m compileall -q -x '(^|/)(site|\.septicscope-build)/' .
          python tools/provider_discovery.py --self-test
          python tools/seo_hourly_audit.py --self-test
          python tools/indexing_hygiene.py --self-test
          python tools/indexnow_submit.py /dev/null --self-test
          python tools/sync_curated_providers.py --self-test

      - name: Build the quality-gated production site
        run: python build_site.py

      - name: Inspect free official provider sources without changing the repository
        run: |
          python tools/provider_discovery.py \
            --county-limit "$COUNTY_LIMIT" \
            --max-additions "$COUNTY_LIMIT" \
            --search-budget 0 \
            --dry-run \
            --report provider-research-report.json

      - name: Enforce quality-recovery policy
        run: python quality_recovery.py --check

      - name: Review page-level search intent
        run: python tools/seo_hourly_audit.py --site site --report seo-quality-report.json

      - name: Audit internal links and generated-site integrity
        run: python audit_site.py | tee internal-audit.txt

      - name: Audit generated indexing hygiene
        run: python tools/indexing_hygiene.py --site site | tee indexing-audit.txt

      - name: Audit external sources
        run: python audit_site.py --external | tee external-audit.txt

      - name: Audit AdSense and content quality
        run: python adsense_audit.py | tee adsense-audit.txt

      - name: Upload research and audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-quality-diagnostics-${{ github.run_number }}
          path: |
            provider-research-report.json
            seo-quality-report.json
            internal-audit.txt
            indexing-audit.txt
            external-audit.txt
            adsense-audit.txt
            site/data/adsense-quality-recovery.json
            site/data/adsense-quality-recovery.txt
            site/data/project-audit-summary.json
            site/data/keyword-map.json
            site/index.html
            site/faq/index.html
            site/about/index.html
            site/counties/index.html
          retention-days: 30
          if-no-files-found: warn
