name: Validate SepticScope site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: validate-septicscope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources and self-test maintenance tooling
        run: |
          python -m compileall -q -x '(^|/)(site|\.septicscope-build)/' .
          python tools/provider_discovery.py --self-test
          python tools/continuous_growth.py --self-test
          python tools/seo_hourly_audit.py --self-test
          python tools/indexnow_submit.py /dev/null --self-test
          python tools/sync_curated_providers.py --self-test

      - name: Build complete production site
        run: python build_site.py

      - name: Verify county lookup and gated service-directory behavior
        id: inventory
        continue-on-error: true
        run: |
          test -f site/deployment-manifest.txt
          cat site/deployment-manifest.txt
          test -f site/build-info.json
          test -f site/data/national-coverage-manifest.json
          test -f site/data/keyword-map.json
          test -f site/data/source-catalog.json
          test -f site/data/provider-directory.json
          test -f site/data/project-audit-summary.json
          test -f site/data/project-audit-summary.txt
          test -f site/data/hourly-seo-build-report.json
          test -f site/data/continuous-growth-report.json
          test -f site/data/county-lookup.json
          test -f site/data/service-directory-status.json
          test -f site/data/septic-services-near-me.json
          test -f site/assets/county-lookup.js
          test -f site/assets/septic-services-near-me.css
          test -f site/assets/septic-services-near-me.js
          test -f site/f1c5f33bc7de84c635e009f874dc4be9.txt
          test -f site/providers/index.html
          test -f site/septic-services-near-me/index.html
          test -f site/counties/index.html
          test -f site/counties/maryland/baltimore/index.html
          test -f site/counties/maryland/baltimore-city/index.html
          test -f site/counties/missouri/st-louis/index.html
          test -f site/counties/missouri/st-louis-city/index.html
          test -f site/counties/virginia/fairfax/index.html
          test -f site/counties/virginia/fairfax-city/index.html
          test -f site/counties/north-carolina/guilford/index.html
          test -f site/counties/alabama/mobile/index.html
          test -f site/counties/tennessee/bedford/index.html
          test -f site/counties/idaho/ada/index.html
          test -f site/guides/septic-drainfield-repair-replacement/index.html
          test -f site/guides/septic-tank-size-calculator/index.html
          test -f site/guides/septic-maintenance-checklist/index.html
          test -f site/guides/types-of-septic-systems/index.html
          test -f site/guides/septic-system-winter-care/index.html
          test -f site/guides/septic-inspection-checklist/index.html
          test -f site/guides/septic-system-lifespan/index.html
          node --check site/assets/county-lookup.js
          node --check site/assets/septic-services-near-me.js
          python site_inventory.py --check
          python tools/seo_hourly_audit.py --site site --report validation-seo-report.json
          python tools/continuous_growth.py --site site --state data/growth-links.json --report validation-growth-report.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          summary = json.loads(Path('site/data/project-audit-summary.json').read_text())
          counts = summary['counts']
          required_zero = {
              'pages_without_primary_keywords',
              'duplicate_title_groups',
              'duplicate_h1_groups',
              'duplicate_meta_description_groups',
              'canonical_errors',
              'canonical_domain_conflicts',
              'accessibility_warnings',
              'legacy_brand_occurrences',
          }
          failures = {key: counts[key] for key in required_zero if counts[key] != 0}
          if failures:
              raise SystemExit(f'Final metadata/SEO quality counts are not zero: {failures}')

          home = Path('site/index.html').read_text(encoding='utf-8')
          home_visible = re.sub(r'<[^>]+>', ' ', home)
          home_visible = re.sub(r'\s+', ' ', home_visible)
          expected = {
              'verified county guides': counts['verified_county_guides'],
              'FAQ articles': counts['faq_articles'],
              'septic guides': counts['guide_articles_and_tools'],
          }
          for label, value in expected.items():
              if not re.search(rf'\b{value:,}\s+{re.escape(label)}\b', home_visible, flags=re.I):
                  raise SystemExit(f'Homepage does not show current metric: {value:,} {label}')
          if 'data-county-lookup-root' not in home or '/assets/county-lookup.js' not in home:
              raise SystemExit('Homepage county lookup is missing')
          for forbidden in ('href="/septic-services-near-me/', "href='/septic-services-near-me/", 'href="/providers/', "href='/providers/"):
              if forbidden in home:
                  raise SystemExit(f'Homepage still promotes an incomplete service directory: {forbidden}')
          if re.search(r'Browse\s+Indiana\s+septic', home_visible, flags=re.I):
              raise SystemExit('Obsolete Indiana-only homepage promotion remains')

          county_page = Path('site/counties/index.html').read_text(encoding='utf-8')
          if 'data-county-lookup-root' not in county_page or 'County FIPS' not in county_page:
              raise SystemExit('County directory does not include ZIP/city/county/FIPS lookup')
          if 'noindex' in county_page.lower():
              raise SystemExit('County lookup must remain indexable')

          county_data = json.loads(Path('site/data/county-lookup.json').read_text())
          county_rows = county_data.get('counties', [])
          if county_data.get('record_count') != 3144 or len(county_rows) != 3144:
              raise SystemExit('County lookup does not contain all 3,144 county-equivalents')
          if len({row.get('f') for row in county_rows}) != 3144:
              raise SystemExit('County lookup contains duplicate county FIPS records')
          incomplete_counties = [row for row in county_rows if not row.get('f') or not row.get('n') or not row.get('s') or not row.get('u')]
          if incomplete_counties:
              raise SystemExit('County lookup contains incomplete records')

          service_data = json.loads(Path('site/data/septic-services-near-me.json').read_text())
          service_providers = service_data.get('providers', [])
          service_counties = service_data.get('counties', [])
          if len(service_counties) != 3144 or len({row.get('f') for row in service_counties}) != 3144:
              raise SystemExit('Background provider coverage dataset is not nationally complete')
          provider_ids = [row.get('id') for row in service_providers]
          if len(provider_ids) != len(set(provider_ids)):
              raise SystemExit('Provider dataset contains duplicate provider IDs')
          incomplete_providers = [
              row.get('id') for row in service_providers
              if not row.get('name') or not row.get('phone') or not row.get('source')
              or not row.get('fips') or not row.get('services') or not row.get('coverage')
          ]
          if incomplete_providers:
              raise SystemExit(f'Provider records are missing required evidence fields: {incomplete_providers[:10]}')
          if counts['provider_listings'] != len(service_providers):
              raise SystemExit(
                  f'Inventory/provider data drift: {counts["provider_listings"]} versus {len(service_providers)}'
              )

          status = json.loads(Path('site/data/service-directory-status.json').read_text())
          covered = {
              str(fips)
              for provider in service_providers
              for fips in provider.get('fips', [])
          }
          if status.get('covered_counties') != len(covered):
              raise SystemExit('Service-directory coverage status does not match provider data')
          expected_public = len(covered) == 3144
          if bool(status.get('public')) != expected_public:
              raise SystemExit('Service-directory launch gate is inconsistent')

          locator = Path('site/septic-services-near-me/index.html').read_text(encoding='utf-8')
          provider_page = Path('site/providers/index.html').read_text(encoding='utf-8')
          sitemap = Path('site/sitemap.xml').read_text(encoding='utf-8')
          if expected_public:
              if 'noindex' in locator.lower() or 'data-provider-card' not in locator:
                  raise SystemExit('Complete service search should be public')
              if 'noindex' in provider_page.lower():
                  raise SystemExit('Complete provider directory should be public')
              if sitemap.count('https://septicscope.com/septic-services-near-me/') != 1:
                  raise SystemExit('Public service search must appear once in the sitemap')
          else:
              if 'noindex,follow' not in locator.replace(' ', '').lower() or 'data-provider-card' in locator:
                  raise SystemExit('Incomplete service search must be hidden and non-searchable')
              if 'noindex,follow' not in provider_page.replace(' ', '').lower():
                  raise SystemExit('Incomplete provider directory must be noindex')
              provider_body = provider_page.split('<main', 1)[-1]
              if '<article class="ss-provider-card">' in provider_body:
                  raise SystemExit('Incomplete national provider directory must not show listing cards')
              if 'https://septicscope.com/septic-services-near-me/' in sitemap or 'https://septicscope.com/providers/' in sitemap:
                  raise SystemExit('Incomplete service pages must be absent from the sitemap')
              public_refs = []
              for page in Path('site').rglob('*.html'):
                  if page in {Path('site/septic-services-near-me/index.html'), Path('site/providers/index.html')}:
                      continue
                  text = page.read_text(encoding='utf-8', errors='replace').lower()
                  if 'href="/septic-services-near-me/' in text or "href='/septic-services-near-me/" in text:
                      public_refs.append(str(page))
                  if 'href="/providers/' in text or "href='/providers/" in text:
                      public_refs.append(str(page))
              if public_refs:
                  raise SystemExit(f'Incomplete service-directory links remain public: {public_refs[:10]}')

          growth_state = json.loads(Path('data/growth-links.json').read_text())
          growth_report = json.loads(Path('site/data/continuous-growth-report.json').read_text())
          if growth_state.get('schema_version') != 1 or not isinstance(growth_state.get('links'), list):
              raise SystemExit('Continuous-growth state schema is invalid')
          if growth_report.get('mode') != 'plan_only':
              raise SystemExit('Production build must never mutate continuous-growth state')
          for item in growth_state['links']:
              source = str(item.get('source_url', ''))
              target = str(item.get('target_url', ''))
              if not source.startswith('https://septicscope.com/') or not target.startswith('https://septicscope.com/'):
                  raise SystemExit(f'Invalid growth-link URL pair: {source} -> {target}')
              source_path = urlparse(source).path.strip('/')
              page = Path('site/index.html') if not source_path else Path('site') / source_path / 'index.html'
              if not page.exists():
                  raise SystemExit(f'Growth-link source page is missing: {source}')
              text = page.read_text(encoding='utf-8')
              if 'noindex' not in text.lower() and 'data-septicscope-growth-links="1"' not in text:
                  raise SystemExit(f'Growth-link module was not rendered on {source}')
              if urlparse(target).path not in text:
                  raise SystemExit(f'Growth-link target is not present on {source}: {target}')

          key = Path('site/f1c5f33bc7de84c635e009f874dc4be9.txt').read_text().strip()
          if key != 'f1c5f33bc7de84c635e009f874dc4be9':
              raise SystemExit('IndexNow key file is invalid')
          print('PASS: county lookup restored and incomplete global service search remains hidden')
          PY

      - name: Audit every generated page and internal link
        id: internal_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python audit_site.py 2>&1 | tee internal-audit.txt

      - name: Check external government and source links
        id: external_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python audit_site.py --external 2>&1 | tee external-audit.txt

      - name: Audit AdSense readiness and county source quality
        id: adsense_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python adsense_audit.py 2>&1 | tee adsense-audit.txt

      - name: Upload audit diagnostics and representative pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-diagnostics
          path: |
            internal-audit.txt
            external-audit.txt
            adsense-audit.txt
            validation-seo-report.json
            validation-growth-report.json
            site/index.html
            site/counties/index.html
            site/assets/county-lookup.js
            site/data/county-lookup.json
            site/septic-services-near-me/index.html
            site/providers/index.html
            site/data/service-directory-status.json
            site/data/septic-services-near-me.json
            site/build-info.json
            site/data/national-coverage-manifest.json
            site/data/keyword-map.json
            site/data/source-catalog.json
            site/data/provider-directory.json
            site/data/project-audit-summary.json
            site/data/project-audit-summary.txt
            site/data/hourly-seo-build-report.json
            site/data/continuous-growth-report.json
          retention-days: 14

      - name: Enforce all quality gates
        if: always()
        run: |
          test "${{ steps.inventory.outcome }}" = "success"
          test "${{ steps.internal_audit.outcome }}" = "success"
          test "${{ steps.external_audit.outcome }}" = "success"
          test "${{ steps.adsense_audit.outcome }}" = "success"
