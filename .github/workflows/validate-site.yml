name: Validate SepticScope site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: validate-septicscope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source and self-test maintenance tooling
        run: |
          python -m compileall -q -x '(^|/)(site|\.septicscope-build)/' .
          python tools/provider_discovery.py --self-test
          python tools/seo_hourly_audit.py --self-test
          python tools/indexing_hygiene.py --self-test
          python tools/indexnow_submit.py /dev/null --self-test
          python tools/sync_curated_providers.py --self-test

      - name: Build complete quality-gated production site
        run: python build_site.py

      - name: Verify focused public footprint and recovery policy
        id: recovery
        continue-on-error: true
        run: |
          node --check site/assets/county-lookup.js
          python quality_recovery.py --check
          python quality_recovery_strict.py --check
          python site_inventory.py --check
          python tools/seo_hourly_audit.py --site site --report validation-seo-report.json
          python tools/check_quality_recovery.py

      - name: Audit every generated page and internal link
        id: internal_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python audit_site.py 2>&1 | tee internal-audit.txt

      - name: Audit indexing hygiene
        id: indexing_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/indexing_hygiene.py --site site 2>&1 | tee indexing-audit.txt

      - name: Check external government and source links
        id: external_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python audit_site.py --external 2>&1 | tee external-audit.txt

      - name: Audit AdSense readiness and content quality
        id: adsense_audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python adsense_audit.py 2>&1 | tee adsense-audit.txt

      - name: Upload recovery diagnostics and representative pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsense-quality-recovery-diagnostics
          path: |
            internal-audit.txt
            indexing-audit.txt
            external-audit.txt
            adsense-audit.txt
            validation-seo-report.json
            site/index.html
            site/faq/index.html
            site/about/index.html
            site/counties/index.html
            site/guides/index.html
            site/guides/buying-a-house-with-septic/index.html
            site/sitemap.xml
            site/_redirects
            site/build-info.json
            site/data/adsense-quality-recovery.json
            site/data/adsense-quality-recovery.txt
            site/data/national-coverage-manifest.json
            site/data/keyword-map.json
            site/data/project-audit-summary.json
            site/data/project-audit-summary.txt
          retention-days: 30

      - name: Enforce all quality gates
        if: always()
        env:
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          INTERNAL_OUTCOME: ${{ steps.internal_audit.outcome }}
          INDEXING_OUTCOME: ${{ steps.indexing_audit.outcome }}
          EXTERNAL_OUTCOME: ${{ steps.external_audit.outcome }}
          ADSENSE_OUTCOME: ${{ steps.adsense_audit.outcome }}
        run: |
          python - <<'PY'
          import os
          outcomes = {
              "recovery": os.environ.get("RECOVERY_OUTCOME", ""),
              "internal": os.environ.get("INTERNAL_OUTCOME", ""),
              "indexing": os.environ.get("INDEXING_OUTCOME", ""),
              "external": os.environ.get("EXTERNAL_OUTCOME", ""),
              "adsense": os.environ.get("ADSENSE_OUTCOME", ""),
          }
          print("Quality gate outcomes:", outcomes)
          failed = {name: result for name, result in outcomes.items() if result != "success"}
          if failed:
              raise SystemExit(f"Quality gates failed: {failed}")
          print("PASS: all SepticScope quality-recovery gates succeeded")
          PY
