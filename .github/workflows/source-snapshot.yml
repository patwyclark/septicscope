name: Export SepticScope source snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: septicscope-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !site/**
            !.septicscope-build/**
            !**/__pycache__/**
            !**/*.pyc
          retention-days: 7
          include-hidden-files: true
