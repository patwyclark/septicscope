name: Verify Arizona completion deployment

on:
  workflow_run:
    workflows: ["Validate SepticScope site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-arizona:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify all 15 Arizona county guides on production
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "https://septicscope.com"
          expected_sha = os.environ["EXPECTED_SHA"].strip()
          expected_slugs = {
              "apache",
              "cochise",
              "coconino",
              "gila",
              "graham",
              "greenlee",
              "la-paz",
              "maricopa",
              "mohave",
              "navajo",
              "pima",
              "pinal",
              "santa-cruz",
              "yavapai",
              "yuma",
          }

          def fetch(path: str, timeout: int = 30) -> str:
              separator = "&" if "?" in path else "?"
              request = Request(
                  f"{base}{path}{separator}v={int(time.time())}",
                  headers={
                      "User-Agent": "SepticScope Arizona production regression",
                      "Cache-Control": "no-cache",
                  },
              )
              with urlopen(request, timeout=timeout) as response:
                  if response.status != 200:
                      raise SystemExit(f"{path} returned {response.status}")
                  return response.read().decode("utf-8", errors="replace")

          info = None
          last_error = "not checked"
          for attempt in range(40):
              try:
                  info = json.loads(fetch("/build-info.json", timeout=20))
                  deployed_sha = str(info.get("commit_sha", ""))
                  if deployed_sha == expected_sha:
                      print(f"Cloudflare deployment confirmed at commit {deployed_sha}")
                      break
                  last_error = (
                      f"deployed commit is {deployed_sha or 'unknown'}, "
                      f"expected {expected_sha}"
                  )
              except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as exc:
                  last_error = repr(exc)
              print(f"Waiting for deployment ({attempt + 1}/40): {last_error}")
              time.sleep(15)
          else:
              raise SystemExit(f"Production did not reach expected commit: {last_error}")

          if info is None or info.get("quality_gate") != "pass":
              raise SystemExit(f"Production quality gate is not passing: {info}")
          if int(info.get("published_county_or_equivalent_pages", 0)) != 3144:
              raise SystemExit(f"National county coverage changed unexpectedly: {info}")
          if int(info.get("verified_county_guides", 0)) < 450:
              raise SystemExit(
                  f"Verified county total regressed below the Arizona completion baseline: {info}"
              )

          hub = fetch("/counties/arizona/")
          hub_paths = set(
              re.findall(
                  r'href=["\'](/counties/arizona/([^/"\']+)/)["\']',
                  hub,
                  flags=re.I,
              )
          )
          actual_slugs = {slug.lower() for _path, slug in hub_paths}
          if actual_slugs != expected_slugs:
              missing = sorted(expected_slugs - actual_slugs)
              extra = sorted(actual_slugs - expected_slugs)
              raise SystemExit(
                  f"Arizona hub county-link mismatch; missing={missing}, extra={extra}"
              )
          print("PASS /counties/arizona/ exposes all 15 Arizona county guides")

          sitemap = fetch("/sitemap.xml")
          for slug in sorted(expected_slugs):
              path = f"/counties/arizona/{slug}/"
              canonical = f"{base}{path}"
              if canonical not in sitemap:
                  raise SystemExit(f"Arizona guide is missing from sitemap: {canonical}")

              body = fetch(path)
              lower = body.lower()
              if "noindex" in lower:
                  raise SystemExit(f"Completed Arizona guide is unexpectedly noindex: {path}")
              canonical_pattern = re.compile(
                  r'<link\b(?=[^>]*\brel=["\']canonical["\'])'
                  r'(?=[^>]*\bhref=["\']' + re.escape(canonical) + r'["\'])[^>]*>',
                  flags=re.I,
              )
              if not canonical_pattern.search(body):
                  raise SystemExit(f"Completed Arizona guide has the wrong canonical: {path}")
              required_markers = (
                  "Official sources",
                  "Arizona statewide permit framework",
                  "Report outdated county information",
              )
              missing_markers = [
                  marker for marker in required_markers if marker.lower() not in lower
              ]
              if missing_markers:
                  raise SystemExit(
                      f"{path} is missing required verified-guide markers: {missing_markers}"
                  )
              print(f"PASS {path}")

          print(
              "PASS: all 15 Arizona county guides are deployed, indexable, canonical, "
              "source-backed, and present in the sitemap"
          )
          PY
