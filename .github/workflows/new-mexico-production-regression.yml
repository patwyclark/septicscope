name: Verify New Mexico completion deployment

on:
  workflow_run:
    workflows: ["Validate SepticScope site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-new-mexico:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify all 33 New Mexico county guides on production
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "https://septicscope.com"
          expected_sha = os.environ["EXPECTED_SHA"].strip()
          expected_slugs = {
              "bernalillo",
              "catron",
              "chaves",
              "cibola",
              "colfax",
              "curry",
              "de-baca",
              "do-a-ana",
              "eddy",
              "grant",
              "guadalupe",
              "harding",
              "hidalgo",
              "lea",
              "lincoln",
              "los-alamos",
              "luna",
              "mckinley",
              "mora",
              "otero",
              "quay",
              "rio-arriba",
              "roosevelt",
              "sandoval",
              "san-juan",
              "san-miguel",
              "santa-fe",
              "sierra",
              "socorro",
              "taos",
              "torrance",
              "union",
              "valencia",
          }

          def fetch(path: str, timeout: int = 30) -> str:
              separator = "&" if "?" in path else "?"
              request = Request(
                  f"{base}{path}{separator}v={int(time.time())}",
                  headers={
                      "User-Agent": "SepticScope New Mexico production regression",
                      "Cache-Control": "no-cache",
                  },
              )
              with urlopen(request, timeout=timeout) as response:
                  if response.status != 200:
                      raise SystemExit(f"{path} returned {response.status}")
                  return response.read().decode("utf-8", errors="replace")

          info = None
          last_error = "not checked"
          for attempt in range(40):
              try:
                  info = json.loads(fetch("/build-info.json", timeout=20))
                  deployed_sha = str(info.get("commit_sha", ""))
                  if deployed_sha == expected_sha:
                      print(f"Cloudflare deployment confirmed at commit {deployed_sha}")
                      break
                  last_error = (
                      f"deployed commit is {deployed_sha or 'unknown'}, "
                      f"expected {expected_sha}"
                  )
              except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as exc:
                  last_error = repr(exc)
              print(f"Waiting for deployment ({attempt + 1}/40): {last_error}")
              time.sleep(15)
          else:
              raise SystemExit(f"Production did not reach expected commit: {last_error}")

          if info is None or info.get("quality_gate") != "pass":
              raise SystemExit(f"Production quality gate is not passing: {info}")
          if int(info.get("published_county_or_equivalent_pages", 0)) != 3144:
              raise SystemExit(f"National county coverage changed unexpectedly: {info}")
          if int(info.get("verified_county_guides", 0)) < 442:
              raise SystemExit(
                  f"Verified county total regressed below the New Mexico completion baseline: {info}"
              )

          completed_states = info.get("completed_states_and_dc")
          if completed_states not in (None, ""):
              if int(completed_states) < 4:
                  raise SystemExit(
                      f"Completed-state total regressed below the New Mexico completion baseline: {info}"
                  )
          else:
              print(
                  "build-info.json does not publish completed_states_and_dc; "
                  "relying on the direct 33-county New Mexico checks below"
              )

          hub = fetch("/counties/new-mexico/")
          hub_paths = set(
              re.findall(
                  r'href=["\'](/counties/new-mexico/([^/"\']+)/)["\']',
                  hub,
                  flags=re.I,
              )
          )
          actual_slugs = {slug.lower() for _path, slug in hub_paths}
          if actual_slugs != expected_slugs:
              missing = sorted(expected_slugs - actual_slugs)
              extra = sorted(actual_slugs - expected_slugs)
              raise SystemExit(
                  f"New Mexico hub county-link mismatch; missing={missing}, extra={extra}"
              )
          print("PASS /counties/new-mexico/ exposes all 33 New Mexico county guides")

          sitemap = fetch("/sitemap.xml")
          representative = {}
          for slug in sorted(expected_slugs):
              path = f"/counties/new-mexico/{slug}/"
              canonical = f"{base}{path}"
              if canonical not in sitemap:
                  raise SystemExit(f"New Mexico guide is missing from sitemap: {canonical}")

              body = fetch(path)
              lower = body.lower()
              if "noindex" in lower:
                  raise SystemExit(f"Completed New Mexico guide is unexpectedly noindex: {path}")
              canonical_pattern = re.compile(
                  r'<link\b(?=[^>]*\brel=["\']canonical["\'])'
                  r'(?=[^>]*\bhref=["\']' + re.escape(canonical) + r'["\'])[^>]*>',
                  flags=re.I,
              )
              if not canonical_pattern.search(body):
                  raise SystemExit(f"Completed New Mexico guide has the wrong canonical: {path}")
              if "official sources" not in lower:
                  raise SystemExit(f"Completed New Mexico guide lacks its official-source section: {path}")
              if "local guide in progress" in lower:
                  raise SystemExit(f"Completed New Mexico guide reverted to fallback copy: {path}")

              if slug in {"bernalillo", "catron", "los-alamos", "union"}:
                  representative[slug] = body
              print(f"PASS {path}")

          current_rule = "https://www.srca.nm.gov/parts/title20/20.007.0003.html"
          for slug, body in representative.items():
              if current_rule not in body:
                  raise SystemExit(
                      f"Representative New Mexico guide lacks the current official 20.7.3 NMAC source: {slug}"
                  )

          bernalillo = representative["bernalillo"].lower()
          for domain_marker in (
              "lwop.waste.web.env.nm.gov",
              "aca-prod.accela.com/bernco",
          ):
              if domain_marker not in bernalillo:
                  raise SystemExit(
                      f"Bernalillo County guide lacks required jurisdiction source: {domain_marker}"
                  )

          print(
              "PASS: all 33 New Mexico county guides are deployed, indexable, canonical, "
              "source-backed, and present in the sitemap"
          )
          PY
