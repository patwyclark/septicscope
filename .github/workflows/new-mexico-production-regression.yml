name: Verify New Mexico completion deployment

on:
  workflow_run:
    workflows: ["Validate SepticScope site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-new-mexico:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify all 33 New Mexico county guides on production
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "https://septicscope.com"
          expected = os.environ["EXPECTED_SHA"].strip()
          info = None
          last_error = "not checked"

          def fetch(path: str) -> str:
              request = Request(
                  f"{base}{path}?v={int(time.time())}",
                  headers={
                      "User-Agent": "SepticScope New Mexico production regression",
                      "Cache-Control": "no-cache",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"{path} returned {response.status}")
                  return response.read().decode("utf-8", errors="replace")

          for attempt in range(40):
              try:
                  request = Request(
                      f"{base}/build-info.json?v={int(time.time())}",
                      headers={
                          "User-Agent": "SepticScope New Mexico production regression",
                          "Cache-Control": "no-cache",
                      },
                  )
                  with urlopen(request, timeout=20) as response:
                      info = json.load(response)
                  deployed = str(info.get("commit_sha", ""))
                  if deployed == expected:
                      print(f"Cloudflare deployment confirmed at commit {deployed}")
                      break
                  last_error = f"deployed commit is {deployed or 'unknown'}, expected {expected}"
              except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as exc:
                  last_error = repr(exc)
              print(f"Waiting for deployment ({attempt + 1}/40): {last_error}")
              time.sleep(15)
          else:
              raise SystemExit(f"Production did not reach expected commit: {last_error}")

          if info.get("quality_gate") != "pass":
              raise SystemExit(f"Production quality gate is not passing: {info}")
          if int(info.get("published_county_or_equivalent_pages", 0)) != 3144:
              raise SystemExit(f"National county coverage changed unexpectedly: {info}")
          if int(info.get("verified_county_guides", 0)) < 442:
              raise SystemExit(f"Verified county total regressed below the New Mexico completion baseline: {info}")
          if int(info.get("completed_states_and_dc", 0)) < 4:
              raise SystemExit(f"Completed-state total regressed below the New Mexico completion baseline: {info}")

          checks = {
              "/counties/new-mexico/": (
                  "All 33 New Mexico counties now have source-checked SepticScope guides",
                  "Bernalillo",
              ),
              "/counties/new-mexico/bernalillo/": (
                  "Bernalillo County",
                  "outside the NMED liquid-waste program",
                  "Official sources",
                  "Verify the parcel’s jurisdiction",
              ),
              "/counties/new-mexico/catron/": (
                  "Catron County",
                  "field office serving Catron County",
                  "Official sources",
                  "County-specific information not confirmed",
              ),
              "/counties/new-mexico/los-alamos/": (
                  "Los Alamos County",
                  "field office serving Los Alamos County",
                  "Official sources",
                  "County-specific information not confirmed",
              ),
              "/counties/new-mexico/union/": (
                  "Union County",
                  "Official sources",
                  "County-specific information not confirmed",
              ),
              "/sitemap.xml": (
                  "https://septicscope.com/counties/new-mexico/bernalillo/",
                  "https://septicscope.com/counties/new-mexico/catron/",
                  "https://septicscope.com/counties/new-mexico/los-alamos/",
                  "https://septicscope.com/counties/new-mexico/union/",
              ),
          }

          bodies = {}
          for path, needles in checks.items():
              body = fetch(path)
              missing = [needle for needle in needles if needle.lower() not in body.lower()]
              if missing:
                  raise SystemExit(f"{path} is missing expected production content: {missing}")
              bodies[path] = body
              print(f"PASS {path}")

          hub_links = set(
              re.findall(
                  r'href=["\'](/counties/new-mexico/[^"\']+/)["\']',
                  bodies["/counties/new-mexico/"],
                  flags=re.I,
              )
          )
          if len(hub_links) != 33:
              raise SystemExit(f"New Mexico hub exposes {len(hub_links)} county links instead of 33")

          verified_paths = (
              "/counties/new-mexico/bernalillo/",
              "/counties/new-mexico/catron/",
              "/counties/new-mexico/los-alamos/",
              "/counties/new-mexico/union/",
          )
          for path in verified_paths:
              body = bodies[path]
              if "noindex" in body.lower():
                  raise SystemExit(f"Completed New Mexico guide is unexpectedly noindex: {path}")
              expected_canonical = f'<link rel="canonical" href="{base}{path}">'
              if expected_canonical.lower() not in body.lower():
                  raise SystemExit(f"Completed New Mexico guide has the wrong canonical: {path}")
              if "https://www.srca.nm.gov/parts/title20/20.007.0003.html" not in body:
                  raise SystemExit(f"Completed New Mexico guide lacks the current official 20.7.3 NMAC source: {path}")

          bernalillo = bodies["/counties/new-mexico/bernalillo/"]
          required_bern_links = (
              "https://lwop.waste.web.env.nm.gov/wwtspf/instructions",
              "https://aca-prod.accela.com/BERNCO/Welcome.aspx",
          )
          for url in required_bern_links:
              if url not in bernalillo:
                  raise SystemExit(f"Bernalillo County guide lacks required jurisdiction source: {url}")

          print("PASS: all 33 New Mexico county guides are deployed and the completion baseline is intact")
          PY
