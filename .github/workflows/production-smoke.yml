name: Verify SepticScope production deployment

on:
  workflow_run:
    workflows: ["Validate SepticScope site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-septicscope-quality-production
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify exact Cloudflare quality-recovery deployment
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          BASE = "https://septicscope.com"
          EXPECTED = os.environ["EXPECTED_SHA"].strip()
          ADSENSE = "ca-pub-8782868222380999"
          HEADERS = {
              "User-Agent": "SepticScope production quality smoke test",
              "Cache-Control": "no-cache",
          }

          def fetch(path: str, timeout: int = 30) -> str:
              separator = "&" if "?" in path else "?"
              request = Request(
                  f"{BASE}{path}{separator}v={int(time.time())}",
                  headers=HEADERS,
              )
              with urlopen(request, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return response.read().decode("utf-8", errors="replace")

          info = None
          last_error = "not checked"
          for attempt in range(60):
              try:
                  info = json.loads(fetch("/build-info.json", 20))
                  deployed = str(info.get("commit_sha", ""))
                  if deployed == EXPECTED:
                      print(f"Cloudflare deployment confirmed at {deployed}")
                      break
                  last_error = f"deployed {deployed or 'unknown'}; expected {EXPECTED}"
              except (HTTPError, URLError, TimeoutError, RuntimeError, json.JSONDecodeError) as exc:
                  last_error = repr(exc)
              print(f"Waiting for deployment ({attempt + 1}/60): {last_error}")
              time.sleep(15)
          else:
              raise SystemExit(f"Production did not reach expected commit: {last_error}")

          recovery = json.loads(fetch("/data/adsense-quality-recovery.json"))
          audit = json.loads(fetch("/data/project-audit-summary.json"))
          lookup = json.loads(fetch("/data/county-lookup.json"))
          service_status = json.loads(fetch("/data/service-directory-status.json"))
          home = fetch("/")
          counties = fetch("/counties/")
          guides = fetch("/guides/")
          faq = fetch("/faq/")
          about = fetch("/about/")
          providers = fetch("/providers/")
          service = fetch("/septic-services-near-me/")
          sitemap_text = fetch("/sitemap.xml")
          robots = fetch("/robots.txt")
          ads_txt = fetch("/ads.txt")

          if info.get("quality_gate") != "pass":
              raise SystemExit(f"Production quality gate is not passing: {info}")
          if int(info.get("published_county_or_equivalent_pages", 0)) != 3144:
              raise SystemExit(f"National county/FIPS coverage changed: {info}")
          if not recovery.get("recovery_mode"):
              raise SystemExit("AdSense/search quality recovery mode is not active")

          approved = int(recovery.get("quality_approved_counties", 0))
          retained_guides = int(recovery.get("retained_long_form_guides", 0))
          expected_sitemap = int(recovery.get("sitemap_urls", -1))
          if not 5 <= approved <= 175:
              raise SystemExit(f"Unexpected quality-approved county footprint: {approved}")
          if retained_guides < 8:
              raise SystemExit(f"Too few substantive national guides: {retained_guides}")
          if not 1 <= expected_sitemap <= 210:
              raise SystemExit(f"Focused sitemap count is invalid: {expected_sitemap}")
          counts = audit.get("counts", {})
          if int(counts.get("verified_county_guides", -1)) != approved:
              raise SystemExit("Inventory and recovery county counts do not match")
          if int(info.get("verified_county_guides", -1)) != approved:
              raise SystemExit("Build-info and recovery county counts do not match")
          for key in (
              "pages_without_primary_keywords", "duplicate_title_groups",
              "duplicate_h1_groups", "duplicate_meta_description_groups",
              "canonical_errors", "canonical_domain_conflicts",
              "accessibility_warnings", "legacy_brand_occurrences",
          ):
              if int(counts.get(key, -1)) != 0:
                  raise SystemExit(f"Production metadata quality regression: {key}={counts.get(key)}")

          # The national lookup remains complete, but only quality-approved counties
          # are marked as direct published local guides.
          rows = lookup.get("counties", [])
          if lookup.get("record_count") != 3144 or len(rows) != 3144:
              raise SystemExit("County lookup is not nationally complete")
          if len({row.get("f") for row in rows}) != 3144:
              raise SystemExit("County lookup contains duplicate FIPS records")
          if sum(bool(row.get("v")) for row in rows) != approved:
              raise SystemExit("County lookup approval flags do not match recovery report")
          if "data-county-lookup-root" not in home or "/assets/county-lookup.js" not in home:
              raise SystemExit("Homepage county/ZIP/city/FIPS lookup is missing")
          if "data-county-lookup-root" not in counties or "County FIPS" not in counties:
              raise SystemExit("County directory lookup is missing")

          # Homepage and core editorial resources must communicate the quality reset.
          for phrase in (
              "Practical septic guidance for real property decisions",
              "Fewer pages, stronger reasons to trust each one",
              "One comprehensive septic FAQ instead of thin answer pages",
          ):
              if phrase not in home:
                  raise SystemExit(f"Quality-first homepage is missing {phrase!r}")
          for phrase in ("High-coverage state hubs", "3,144 county and county-equivalent pages"):
              if phrase in re.sub(r"<[^>]+>", " ", home):
                  raise SystemExit(f"Homepage still markets page volume: {phrase}")
          if ADSENSE not in home:
              raise SystemExit("Substantive homepage lost AdSense site code")

          if faq.count("<h2>") < 10 or '"@type": "FAQPage"' not in faq:
              raise SystemExit("Consolidated FAQ hub is incomplete")
          if ADSENSE not in faq:
              raise SystemExit("Substantive FAQ hub lost AdSense site code")
          if "How automation is used" not in about or "Advertising and commercial separation" not in about:
              raise SystemExit("Editorial transparency page is incomplete")
          if ADSENSE in about:
              raise SystemExit("About/editorial policy page must remain ad-free")
          if "Shorter or overlapping pages have been withheld or consolidated" not in guides:
              raise SystemExit("Quality-reviewed guide hub is not deployed")
          if ADSENSE in guides:
              raise SystemExit("Navigation-only guide hub must remain ad-free")
          for route in recovery.get("retained_guide_routes", []):
              if route not in guides:
                  raise SystemExit(f"Guide hub is missing retained guide {route}")
          for item in recovery.get("demoted_guides", []):
              route = item.get("route") if isinstance(item, dict) else ""
              if route and route in guides:
                  raise SystemExit(f"Guide hub still promotes withheld guide {route}")

          # The incomplete service directory remains hidden, noindex, ad-free, and
          # absent from the focused sitemap.
          if bool(service_status.get("public")):
              raise SystemExit("Global service directory unexpectedly launched")
          for label, body in (("provider directory", providers), ("service locator", service)):
              if "noindex,follow" not in body.replace(" ", "").lower():
                  raise SystemExit(f"Incomplete {label} is not noindex,follow")
              if ADSENSE in body:
                  raise SystemExit(f"Incomplete {label} still carries AdSense")
          home_lower = home.lower()
          for href in ('href="/providers/', 'href="/septic-services-near-me/'):
              if href in home_lower:
                  raise SystemExit(f"Homepage promotes incomplete service feature: {href}")

          sitemap_root = ET.fromstring(sitemap_text)
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap_urls = [(node.text or "").strip() for node in sitemap_root.findall(".//s:loc", ns)]
          if len(sitemap_urls) != expected_sitemap or len(sitemap_urls) != len(set(sitemap_urls)):
              raise SystemExit(
                  f"Focused sitemap drift: {len(sitemap_urls)} URLs, expected {expected_sitemap}"
              )
          for forbidden in (f"{BASE}/providers/", f"{BASE}/septic-services-near-me/"):
              if forbidden in sitemap_urls:
                  raise SystemExit(f"Hidden service route remains in sitemap: {forbidden}")
          if f"{BASE}/faq/" not in sitemap_urls or f"{BASE}/about/" not in sitemap_urls:
              raise SystemExit("Core quality/trust pages are missing from sitemap")
          if "Sitemap:" not in robots or "septicscope.com/sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not expose the production sitemap")
          if "google.com, pub-8782868222380999, DIRECT, f08c47fec0942fa0" not in ads_txt:
              raise SystemExit("ads.txt authorization is missing")

          approved_items = recovery.get("approved_counties", [])
          demoted_items = recovery.get("demoted_counties", [])
          if not approved_items or not demoted_items:
              raise SystemExit("Recovery report lacks approved/demoted county samples")
          approved_path = urlparse(approved_items[0]["url"]).path
          approved_html = fetch(approved_path)
          if "noindex" in approved_html.lower() or ADSENSE not in approved_html:
              raise SystemExit(f"Approved county is not indexable/monetizable: {approved_path}")
          if "Official sources" not in approved_html or "Permitting authority" not in approved_html:
              raise SystemExit(f"Approved county lost local source structure: {approved_path}")
          if BASE + approved_path not in sitemap_urls:
              raise SystemExit(f"Approved county is missing from sitemap: {approved_path}")

          demoted_path = urlparse(demoted_items[0]["url"]).path
          demoted_html = fetch(demoted_path)
          if "noindex,follow" not in demoted_html.replace(" ", "").lower():
              raise SystemExit(f"Withheld county is not noindex,follow: {demoted_path}")
          if ADSENSE in demoted_html or "septicscope-quality-status" not in demoted_html:
              raise SystemExit(f"Withheld county is monetized or lacks quality marker: {demoted_path}")
          if BASE + demoted_path in sitemap_urls:
              raise SystemExit(f"Withheld county remains in sitemap: {demoted_path}")

          state_slug = demoted_path.strip("/").split("/")[1]
          state_hub = fetch(f"/counties/{state_slug}/")
          if "noindex,follow" not in state_hub.replace(" ", "").lower() or ADSENSE in state_hub:
              raise SystemExit("Navigation-only state hub is not noindex/ad-free")

          print(
              "PASS: production quality recovery is live — "
              f"{approved} locally differentiated county guides, "
              f"{retained_guides} substantive guides, {len(sitemap_urls)} sitemap URLs"
          )
          PY
