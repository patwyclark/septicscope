name: Verify Hawaii completion deployment

on:
  workflow_run:
    workflows: ["Validate SepticScope site"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: verify-hawaii-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-hawaii:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout current quality baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify all five Hawaii county-equivalent guides on production
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          BASE = "https://septicscope.com"
          EXPECTED = os.environ["EXPECTED_SHA"].strip()
          HEADERS = {
              "User-Agent": "SepticScope Hawaii production regression",
              "Cache-Control": "no-cache",
          }

          def fetch(path: str) -> str:
              request = Request(
                  f"{BASE}{path}?v={int(time.time())}",
                  headers=HEADERS,
              )
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return response.read().decode("utf-8", errors="replace")

          info = None
          last_error = "not checked"
          for attempt in range(60):
              try:
                  info = json.loads(fetch("/build-info.json"))
                  deployed = str(info.get("commit_sha", ""))
                  if deployed == EXPECTED:
                      print(f"Cloudflare deployment confirmed at {deployed}")
                      break
                  last_error = f"deployed {deployed or 'unknown'}; expected {EXPECTED}"
              except (HTTPError, URLError, TimeoutError, RuntimeError, json.JSONDecodeError) as exc:
                  last_error = repr(exc)
              print(f"Waiting for deployment ({attempt + 1}/60): {last_error}")
              time.sleep(15)
          else:
              raise SystemExit(f"Production did not reach expected commit: {last_error}")

          baseline = json.loads(Path("data/quality-baseline.json").read_text(encoding="utf-8"))
          minimum_verified = int(baseline.get("minimum_verified_counties", 0))
          if info.get("quality_gate") != "pass":
              raise SystemExit(f"Production quality gate is not passing: {info}")
          if int(info.get("published_county_or_equivalent_pages", 0)) != 3144:
              raise SystemExit(f"National county coverage changed unexpectedly: {info}")
          if int(info.get("verified_county_guides", 0)) < minimum_verified:
              raise SystemExit(
                  f"Verified county total is below the source-controlled baseline "
                  f"{minimum_verified}: {info}"
              )

          audit = json.loads(fetch("/data/project-audit-summary.json"))
          counts = audit.get("counts", {})
          if int(counts.get("verified_county_guides", 0)) < minimum_verified:
              raise SystemExit(f"Production audit is below the quality baseline: {counts}")
          if int(counts.get("pages_without_primary_keywords", -1)) != 0:
              raise SystemExit(f"An indexable page lacks a primary keyword: {counts}")
          if int(counts.get("canonical_errors", -1)) != 0:
              raise SystemExit(f"Canonical errors are present in production: {counts}")

          county_slugs = ("hawaii", "honolulu", "kalawao", "kauai", "maui")
          checks = {
              "/counties/hawaii/": (
                  "All 5 Hawaii county and county-equivalent pages",
                  "Hawaii Department of Health Wastewater Branch",
              ),
              "/counties/hawaii/hawaii/": (
                  "Hawaii County",
                  "County of Hawaii official website",
                  "County-specific details not independently confirmed",
              ),
              "/counties/hawaii/honolulu/": (
                  "Honolulu County",
                  "City and County of Honolulu official website",
                  "County-specific details not independently confirmed",
              ),
              "/counties/hawaii/kalawao/": (
                  "Kalawao County",
                  "Kalaupapa",
                  "County-specific details not independently confirmed",
              ),
              "/counties/hawaii/kauai/": (
                  "Kauai County",
                  "County of Kauai official website",
                  "County-specific details not independently confirmed",
              ),
              "/counties/hawaii/maui/": (
                  "Maui County",
                  "County of Maui official website",
                  "County-specific details not independently confirmed",
              ),
              "/sitemap.xml": tuple(
                  f"{BASE}/counties/hawaii/{slug}/" for slug in county_slugs
              ),
          }

          bodies = {}
          for path, needles in checks.items():
              body = fetch(path)
              missing = [needle for needle in needles if needle.lower() not in body.lower()]
              if missing:
                  raise SystemExit(f"{path} is missing expected content: {missing}")
              bodies[path] = body
              print(f"PASS {path}")

          hub_links = set(
              re.findall(
                  r'href=["\'](/counties/hawaii/[^"\']+/)["\']',
                  bodies["/counties/hawaii/"],
                  flags=re.I,
              )
          )
          expected_links = {f"/counties/hawaii/{slug}/" for slug in county_slugs}
          if hub_links != expected_links:
              raise SystemExit(f"Hawaii hub links are incomplete or unexpected: {sorted(hub_links)}")

          for slug in county_slugs:
              path = f"/counties/hawaii/{slug}/"
              body = bodies[path]
              if "noindex" in body.lower():
                  raise SystemExit(f"Completed Hawaii guide is unexpectedly noindex: {path}")
              expected_canonical = f'<link rel="canonical" href="{BASE}{path}">'
              if expected_canonical.lower() not in body.lower():
                  raise SystemExit(f"Completed Hawaii guide has the wrong canonical: {path}")
              if "https://health.hawaii.gov/wastewater/" not in body:
                  raise SystemExit(f"Hawaii guide lacks the state Wastewater Branch source: {path}")
              if "https://health.hawaii.gov/opppd/department-of-health-administrative-rules-title-11/" not in body:
                  raise SystemExit(f"Hawaii guide lacks the official Title 11 source: {path}")
              if "Official sources" not in body:
                  raise SystemExit(f"Hawaii guide lacks a visible source section: {path}")

          print(
              "PASS: all five Hawaii county-equivalent guides are deployed and the "
              f"source-controlled quality baseline of {minimum_verified} is intact"
          )
          PY
